                                <button class="emoji-btn flex flex-col items-center justify-center p-4 md:p-6 rounded-2xl border-2 border-slate-100 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-200 transition-all duration-300 group" onclick="selectEmoji(this)">
                                    <span class="text-4xl md:text-6xl mb-3 group-hover:scale-110 transition-transform">🤔</span>
                                    <span class="font-medium text-slate-600">Lumayan paham</span>
                                </button>
                                <button class="emoji-btn flex flex-col items-center justify-center p-4 md:p-6 rounded-2xl border-2 border-slate-100 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-200 transition-all duration-300 group" onclick="selectEmoji(this)">
                                    <span class="text-4xl md:text-6xl mb-3 group-hover:scale-110 transition-transform">🤩</span>
                                    <span class="font-medium text-slate-600">Paham banget!</span>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Soal 2 -->
                        <div class="space-y-4">
                            <label class="block text-xl font-bold text-slate-800">2. Apa bagean sing paling narik kawigatenmu ing materi iki?</label>
                            <textarea class="w-full border-2 border-slate-100 rounded-2xl shadow-sm p-4 text-lg focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 bg-slate-50 transition-all outline-none resize-none" rows="3" placeholder="Tulis tanggapanmu ing kene..."></textarea>
                        </div>
                        
                        <!-- Soal 3 -->
                        <div class="space-y-4">
                            <label class="block text-xl font-bold text-slate-800">3. Apa targetmu mbesuk yen ana tugas praktik sesorah?</label>
                            <textarea class="w-full border-2 border-slate-100 rounded-2xl shadow-sm p-4 text-lg focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 bg-slate-50 transition-all outline-none resize-none" rows="3" placeholder="Conto: Aku arep latihan madhep kaca ben ora gugup..."></textarea>
                        </div>

                        <div class="pt-4">
                            <button onclick="submitRefleksi()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white text-lg font-bold py-4 px-6 rounded-2xl transition-all duration-300 shadow-lg shadow-indigo-200 hover:shadow-xl hover:shadow-indigo-300 transform hover:-translate-y-1">
                                Kirim Refleksi 🚀
                            </button>
                        </div>
                    </div>
                </div>
            `
        };

        // --- Logic and Initialization ---

        function initMenu() {
            const menuContainer = document.getElementById('menu-container');
            menuContainer.innerHTML = menus.map(m => `
                <button onclick="navigate('${m.id}')" 
                    class="menu-btn min-w-fit md:min-w-0 md:w-full text-left px-5 py-3.5 rounded-xl flex items-center gap-3 text-indigo-100 ${currentSection === m.id ? 'active' : ''}">
                    <span class="text-xl opacity-90">${m.icon}</span>
                    <span class="whitespace-nowrap">${m.title}</span>
                </button>
            `).join('');
        }

        function navigate(id) {
            currentSection = id;
            initMenu();
            renderContent();
            
            // Scroll to top of content
            document.getElementById('main-content').scrollTop = 0;
            
            if(id === 'asesmen-awal') initPretest();
            if(id === 'kuis') initKuis();
            if(id === 'asesmen-akhir') initPosttest();
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            main.innerHTML = contentData[currentSection] || '<p>Konten belum tersedia.</p>';
        }

        // --- Simulation Logic ---
        function runSim(isCorrect) {
            const res = document.getElementById('sim-result');
            res.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-700', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-800');
            
            if(isCorrect) {
                res.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-800');
                res.innerHTML = `<div class="flex gap-4 items-start"><span class="text-3xl">🎉</span> <div><strong class="block text-xl mb-1">Mantep Tenan!</strong> Keputusanmu bener banget. Sikap sing tenang, madhep ngarep, lan esem nuduhake <strong>Wiraga</strong> sing apik. Kowe ketok siap lan meyakinkan dadi pamedhar sabda!</div></div>`;
            } else {
                res.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
                res.innerHTML = `<div class="flex gap-4 items-start"><span class="text-3xl">😅</span> <div><strong class="block text-xl mb-1">Wadhuh, kurang pas!</strong> Yen mlayu lan ndhingkluk, audiens bakal mikir kowe ora siap, gugup, utawa ora ngajeni acara. Elinga syarat <strong>Wiraga</strong> (penampilan fisik/gestur). Coba maneh!</div></div>`;
            }
        }

        // --- Quiz Data ---
        const pretestQuestions = [
            { q: "Sesorah kuwi padha karo pidato, nanging nggunakake basa Jawa.", options: ["Bener", "Salah"], answer: 0 },
            { q: "Sesorah biyasane mung ana ing acara duka/kepaten.", options: ["Bener", "Salah"], answer: 1 }
        ];

        const kuisQuestions = [
            { q: "Nalika sesorah, pocapan 't' lan 'th' kudu cetha supaya maknane ora kliru. Iki kelebu nggatekake syarat...", options: ["Wiraga", "Wicara", "Wirasa", "Wirama"], answer: 1 },
            { q: "Munggah mudhune swara, cepet rindhike pocapan supaya ora mboseni diarani...", options: ["Wiraga", "Wicara", "Wirasa", "Wirama"], answer: 3 }
        ];

        const posttestQuestions = [
            { q: "Bagean sesorah sing isine atur panuwun awit rawuhe tamu lan puji syukur marang Gusti diarani...", options: ["Salam Pambuka", "Purwaka (Pambuka)", "Surasa (Isi)", "Wasana (Panutup)"], answer: 1 },
            { q: "Inti utawa pokok bahasan utama ing sesorah mapan ana ing bagean...", options: ["Purwaka", "Surasa Basa", "Wasana Basa", "Dudutan"], answer: 1 },
            { q: "Yen ngadeg ing panggung kaku kaya reca, mripat mandeng dhuwur, tegese kurang nggatekake syarat...", options: ["Wiraga", "Wirama", "Wicara", "Wirasa"], answer: 0 }
        ];

        // --- Generic Quiz Generator ---
        function renderQuiz(containerId, questions, prefix) {
            let html = `<div class="space-y-8" id="${prefix}-wrap">`;
            questions.forEach((item, index) => {
                html += `
                    <div class="p-6 border-2 border-slate-100 rounded-3xl bg-white shadow-sm" id="${prefix}-q-${index}">
                        <p class="font-bold text-xl text-slate-800 mb-5 flex gap-3"><span class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm flex-shrink-0">${index + 1}</span> <span>${item.q}</span></p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pl-0 md:pl-11">
                            ${item.options.map((opt, oIdx) => `
                                <button onclick="checkAnswer('${prefix}', ${index}, ${oIdx}, ${item.answer})" 
                                    class="text-left p-4 rounded-xl border-2 border-slate-100 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-200 transition-all font-medium text-slate-700 ${prefix}-btn-${index}">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                        <div class="hidden mt-4 pl-0 md:pl-11 rounded-xl p-4 text-lg border" id="${prefix}-res-${index}"></div>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById(containerId).innerHTML = html;
        }

        window.checkAnswer = function(prefix, qIdx, selectedIdx, correctIdx) {
            const btns = document.querySelectorAll(`.${prefix}-btn-${qIdx}`);
            const res = document.getElementById(`${prefix}-res-${qIdx}`);
            
            // Disable all buttons in this question
            btns.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('hover:bg-indigo-50', 'hover:border-indigo-200');
            });

            const dataMap = { 'pre': pretestQuestions, 'kuis': kuisQuestions, 'post': posttestQuestions };
            const qData = dataMap[prefix][qIdx];

            if(selectedIdx === correctIdx) {
                btns[selectedIdx].classList.remove('opacity-50', 'border-slate-100', 'bg-slate-50');
                btns[selectedIdx].classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'shadow-lg', 'shadow-emerald-200');
                
                res.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-700');
                res.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
                res.innerHTML = "<strong>✅ Bener!</strong> Wangsulanmu bener.";
            } else {
                btns[selectedIdx].classList.remove('opacity-50', 'border-slate-100', 'bg-slate-50');
                btns[selectedIdx].classList.add('bg-red-500', 'text-white', 'border-red-600');
                
                // Highlight correct answer
                btns[correctIdx].classList.remove('opacity-50', 'border-slate-100', 'bg-slate-50');
                btns[correctIdx].classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-800');

                res.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
                res.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
                res.innerHTML = "<strong>❌ Kurang pas.</strong> Wangsulan sing bener yaiku: <br><span class='mt-1 inline-block px-3 py-1 bg-white rounded border border-red-200'>" + qData.options[correctIdx] + "</span>";
            }
        }

        // --- Reflection Logic ---
        window.selectEmoji = function(btn) {
            const container = btn.parentElement;
            const buttons = container.querySelectorAll('.emoji-btn');
            buttons.forEach(b => {
                b.classList.remove('border-indigo-500', 'bg-indigo-50', 'ring-4', 'ring-indigo-100');
                b.classList.add('border-slate-100', 'bg-slate-50');
            });
            btn.classList.remove('border-slate-100', 'bg-slate-50');
            btn.classList.add('border-indigo-500', 'bg-indigo-50', 'ring-4', 'ring-indigo-100');
        }

        window.submitRefleksi = function() {
            const form = document.getElementById('refleksi-form');
            form.innerHTML = `
                <div class="text-center p-10 py-16 fade-in-up">
                    <div class="w-24 h-24 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-5xl mx-auto mb-6 shadow-xl shadow-green-100">🎉</div>
                    <h3 class="text-3xl font-bold text-slate-800 mb-4">Matur Nuwun!</h3>
                    <p class="text-lg text-slate-600 leading-relaxed max-w-md mx-auto">
                        Refleksimu wis kasimpen. Tetep semangat sinau Basa Jawa, mbesuk kowe mesthi dadi pamedhar sabda sing hebat lan membanggakan!
                    </p>
                    <button onclick="navigate('apersepsi')" class="mt-8 px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold transition-colors">
                        Bali menyang Awal
                    </button>
                </div>
            `;
        }

        // --- Fullscreen Logic ---
        function toggleFullScreen() {
            const doc = window.document;
            const docEl = doc.documentElement;

            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if(!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                requestFullScreen.call(docEl);
            }
            else {
                cancelFullScreen.call(doc);
            }
        }

        function updateFsIcon() {
            if (!document.fullscreenElement && !document.webkitIsFullScreen && !document.mozFullScreen && !document.msFullscreenElement) {
                document.getElementById('fs-icon-enter').classList.remove('hidden');
                document.getElementById('fs-icon-exit').classList.add('hidden');
            } else {
                document.getElementById('fs-icon-enter').classList.add('hidden');
                document.getElementById('fs-icon-exit').classList.remove('hidden');
            }
        }

        // Listen for screen changes (e.g. if user presses ESC)
        document.addEventListener('fullscreenchange', updateFsIcon);
        document.addEventListener('webkitfullscreenchange', updateFsIcon);
        document.addEventListener('mozfullscreenchange', updateFsIcon);
        document.addEventListener('MSFullscreenChange', updateFsIcon);

        // Initialize App
        window.onload = () => {
            initMenu();
            renderContent();
        };
    </script>
</body>
</html>
